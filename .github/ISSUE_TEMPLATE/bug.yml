name: Bug
title: '[bug]: '
description: Something works differently from how it should.

labels: [bug]

body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What goes wrong, in a sentence or two.
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: How to see it
          description: The page, the browser and device, and the steps that show it.
          placeholder: |
              1. Open the affected route
              2. Perform the action
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual
      validations:
          required: true

    - type: textarea
      id: cause
      attributes:
          label: Cause
          description: Why it happens, with the file and line when known. If it isn't known yet, say what has been ruled out.
      validations:
          required: true
