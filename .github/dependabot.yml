version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope

    - package-ecosystem: docker
      directory: /apps/web
      schedule:
          interval: weekly
      commit-message:
          prefix: build
          include: scope
