version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          dependencies:
              patterns:
                  - '*'
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: ci
          include: scope

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          dependencies:
              patterns:
                  - '*'
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: build
          include: scope

    - package-ecosystem: docker
      directory: /apps/web
      schedule:
          interval: weekly
      groups:
          dependencies:
              patterns:
                  - '*'
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: build
          include: scope
