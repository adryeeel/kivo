version: 2

updates:
    - package-ecosystem: github-actions
      directories:
          - /
          - /.github/actions/*
      assignees:
          - adryeeel
      labels:
          - build
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          github-actions:
              patterns:
                  - '*'
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: build
          include: scope
      pull-request-branch-name:
          prefix: build
          branch-name-case: lowercase
          template: '{prefix}/gha/{name}'

    - package-ecosystem: npm
      directory: /
      assignees:
          - adryeeel
      labels:
          - build
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          production:
              dependency-type: production
          development:
              dependency-type: development
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: build
          include: scope
      pull-request-branch-name:
          prefix: build
          branch-name-case: lowercase
          template: '{prefix}/pnpm/{name}'

    - package-ecosystem: docker
      directories:
          - /apps/*
      assignees:
          - adryeeel
      labels:
          - build
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          dependencies:
              patterns:
                  - '*'
          security-dependencies:
              applies-to: security-updates
              patterns:
                  - '*'
      commit-message:
          prefix: build
          include: scope
      pull-request-branch-name:
          prefix: build
          branch-name-case: lowercase
          template: '{prefix}/docker/{name}'
