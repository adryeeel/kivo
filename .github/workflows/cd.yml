name: CD

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]

permissions:
    contents: read

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    publish:
        if: ${{ vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Prepare image reference
              id: image
              env:
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  REPOSITORY: ${{ github.repository }}
              run: echo "image=ghcr.io/${REPOSITORY,,}/web:${SHA}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

    deploy:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: production
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Check deployment configuration and current master
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
                  DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
                  SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  SSH_USERNAME: ${{ vars.VPS_SSH_USERNAME }}
                  REGISTRY_USER: ${{ vars.GHCR_READ_USERNAME }}
                  REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
              run: |
                  set -eu
                  for name in DEPLOY_PATH DEPLOY_PROJECT SSH_HOST SSH_KEY SSH_FINGERPRINT SSH_USERNAME REGISTRY_USER REGISTRY_TOKEN; do
                      if [ -z "${!name}" ]; then echo "Missing deployment setting: $name" >&2; exit 1; fi
                  done
                  case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;; esac
                  if [[ ! "$DEPLOY_PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then echo "Invalid DEPLOY_PROJECT" >&2; exit 1; fi
                  current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
                  if [ "$current" != "$SHA" ]; then echo "Skipping stale revision: master has advanced"; exit 1; fi

            - name: Copy production Compose file
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_SSH_HOST }}
                  username: ${{ vars.VPS_SSH_USERNAME }}
                  port: ${{ vars.VPS_SSH_PORT || '22' }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  source: compose.production.yml
                  target: ${{ vars.DEPLOY_PATH }}

            - name: Pull and deploy the checked revision
              uses: appleboy/ssh-action@v1
              env:
                  IMAGE_REF: ${{ needs.publish.outputs.image }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
                  DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
                  REGISTRY_USER: ${{ vars.GHCR_READ_USERNAME }}
                  REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
              with:
                  host: ${{ secrets.VPS_SSH_HOST }}
                  username: ${{ vars.VPS_SSH_USERNAME }}
                  port: ${{ vars.VPS_SSH_PORT || '22' }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  envs: IMAGE_REF,DEPLOY_PATH,DEPLOY_PROJECT,REGISTRY_USER,REGISTRY_TOKEN
                  script: |
                      set -eu
                      cd "$DEPLOY_PATH"
                      export IMAGE_REF DEPLOY_PROJECT
                      export COMPOSE_PROJECT_NAME="$DEPLOY_PROJECT"
                      export DOCKER_CONFIG="$(mktemp -d)"
                      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
                      printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
                      docker compose -f compose.production.yml pull
                      docker compose -f compose.production.yml up -d --wait --remove-orphans
