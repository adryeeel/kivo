name: CD

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [master]

permissions:
    contents: read

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    publish:
        if: >-
            ${{ vars.DEPLOY_ENABLED == 'true' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'master' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20

        permissions:
            contents: read
            packages: write

        outputs:
            image: ${{ steps.image.outputs.image }}

        steps:
            - name: Check out the verified revision
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Prepare image reference
              id: image
              env:
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  REPOSITORY: ${{ github.repository }}
              run: echo "image=ghcr.io/${REPOSITORY,,}/web:${SHA}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Sign in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.image }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

    deploy:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: production

        steps:
            - name: Check out the verified revision
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Check deployment configuration and current master
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SHA: ${{ github.event.workflow_run.head_sha }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
                  DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
                  SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  SSH_USERNAME: ${{ vars.VPS_SSH_USERNAME }}
                  REGISTRY_USER: ${{ vars.GHCR_READ_USERNAME }}
                  REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
              run: bash .github/scripts/check-deploy.sh

            - name: Copy production Compose file
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_SSH_HOST }}
                  username: ${{ vars.VPS_SSH_USERNAME }}
                  port: ${{ vars.VPS_SSH_PORT || '22' }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  source: compose.production.yml
                  target: ${{ vars.DEPLOY_PATH }}

            - name: Pull and deploy the checked revision
              uses: appleboy/ssh-action@v1
              env:
                  IMAGE_REF: ${{ needs.publish.outputs.image }}
                  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
                  DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
                  REGISTRY_USER: ${{ vars.GHCR_READ_USERNAME }}
                  REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
              with:
                  host: ${{ secrets.VPS_SSH_HOST }}
                  username: ${{ vars.VPS_SSH_USERNAME }}
                  port: ${{ vars.VPS_SSH_PORT || '22' }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
                  envs: IMAGE_REF,DEPLOY_PATH,DEPLOY_PROJECT,REGISTRY_USER,REGISTRY_TOKEN
                  script_path: .github/scripts/deploy.sh
