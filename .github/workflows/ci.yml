name: CI

on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NEXT_TELEMETRY_DISABLED: 1
    TURBO_TELEMETRY_DISABLED: 1

jobs:
    check:
        name: ${{ matrix.check }}
        if: >-
            ${{ github.event_name != 'pull_request' ||
                github.event.pull_request.draft == false }}
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                include:
                    - check: Format
                      command: pnpm fmt:check

                    - check: Lint
                      command: pnpm lint:check && pnpm turbo run lint:check

                    - check: Types
                      command: pnpm turbo run type:check

                    - check: Tests
                      command: pnpm turbo run test:check

                    - check: Build
                      command: pnpm turbo run build --filter=web

        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Set up environment
              uses: ./.github/actions/ci-setup

            - name: Install Chromium
              if: ${{ matrix.check == 'Tests' }}
              run: pnpm --filter web exec playwright install chromium

            - name: Run ${{ matrix.check }}
              run: ${{ matrix.command }}
