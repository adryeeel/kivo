name: Set up CI
description: Set up Node.js and pnpm, then install workspace dependencies.

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
              node-version-file: .node-version

        - name: Set up pnpm
          uses: pnpm/action-setup@v6

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
